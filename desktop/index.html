<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stock DB</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<style>
    @font-face {
      font-family: 'LINE Seed Sans TH';
      src: url('/src/fonts/LINESeedSansTH-Regular.woff2') format('woff2');
      font-weight: 300;
      font-style: normal;
    }
    * {
      font-family: 'LINE Seed Sans TH', sans-serif;
    }
    .unit-select {
  padding: 4px 6px;
  font-size: 14px;
}

table tr:hover {
  background-color: #f5f5f5;
}

td {
  vertical-align: middle;
}
</style>
<body class="min-h-screen bg-sky-50">
  <header class="sticky top-0 z-10 border-b bg-white/80 backdrop-blur">
    <div class="mx-auto max-w-7xl px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="h-10 w-10 rounded-xl flex items-center justify-center">
          <!-- <span class="text-sky-700 font-bold">S</span> -->
           <img src="logo.png" class="w-64 rounded-lg">
        </div>
        <div>
          <h1 class="text-lg font-semibold text-slate-900">Stock Management (Local)</h1>
          <p class="text-xs text-slate-500">ค้นหา/เพิ่มสินค้า</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
       <a
      href="import.html"
      class="inline-flex items-center gap-2 rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800 transition"
    >
      + Import
    </a>
  <a href="transaction.html"
           class="rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50">
          🧾 Transaction
        </a>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-6 py-6">
    <!-- Search Card -->
    <section class="rounded-2xl bg-white shadow-sm border border-slate-100 p-5">
      <div class="flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
        <div class="flex-1">
          <label class="block text-sm font-medium text-slate-700">ค้นหาสินค้า</label>
          <div class="mt-2 flex gap-2">
            <div class="relative flex-1">
              <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">🔎</span>
              <input
                id="keywordInput"
                type="text"
                placeholder="พิมพ์ชื่อสินค้า / BarCode / SKU"
                class="w-full rounded-xl border border-slate-200 bg-white px-10 py-2.5 text-sm text-slate-900
                       placeholder:text-slate-400 focus:outline-none focus:ring-4 focus:ring-sky-100 focus:border-sky-300"
              />
            </div>
            <button
              id="searchBtn"
              class="rounded-xl bg-slate-900 px-4 py-2.5 text-sm font-semibold text-white hover:bg-slate-800 active:scale-[0.99] transition"
            >
              ค้นหา
            </button>
             <div class="flex gap-2">
          <button
            id="clearBtn"
            class="rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-50 transition"
          >
            ล้าง
          </button>
        </div>
          </div>

          <div class="mt-3 flex flex-wrap items-center gap-2">
  <label class="text-xs font-medium text-slate-600">Bucket:</label>

  <select id="bucketType" class="rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm">
    <option value="">เลือกทั้งหมด</option>
    <option value="unit">Unit</option>
    <option value="price">Price</option>
    <option value="sku">SKU</option>
  </select>

  <select id="bucketKey" class="rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm" disabled>
    <option value="">เลือกตัวเลือก</option>
  </select>

  <span class="text-xs text-slate-500" id="bucketHint"></span>
</div>

          <div class="mt-3 flex flex-wrap items-center gap-2 text-xs text-slate-500">
            <span id="resultMeta">พร้อมค้นหา</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Table -->
    <section class="mt-5 rounded-2xl bg-white shadow-sm border border-slate-100 overflow-hidden">
      <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100">
        <h2 class="text-sm font-semibold text-slate-900">ผลการค้นหา</h2>
        <div class="text-xs text-slate-500">
          แสดง <span id="showingCount">0</span> รายการ
        </div>
        
      </div>

      <div class="overflow-x-auto">
        <table class="min-w-full text-sm">
          <thead class="bg-slate-50 text-slate-600">
            <tr>
              <th class="px-4 py-3 text-left font-semibold">SKU</th>
              <th class="px-4 py-3 text-left font-semibold">Product</th>
              <th class="px-4 py-3 text-left font-semibold">Unit</th>
              <th class="px-4 py-3 text-left font-semibold">Factor</th>
              <th class="px-4 py-3 text-right font-semibold">Price</th>
              <th class="px-4 py-3 text-right font-semibold">Stock</th>
            </tr>
          </thead>
          <tbody id="resultBody" class="divide-y divide-slate-100">
            <tr>
              <td colspan="6" class="px-4 py-10 text-center text-slate-400">
                เริ่มต้นด้วยการค้นหาสินค้า
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Pagination -->
      <div class="flex items-center justify-between px-5 py-4 border-t border-slate-100 bg-white">
        <button
          id="prevBtn"
          class="rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50 disabled:opacity-40 disabled:hover:bg-white transition"
          disabled
        >
          ◀ ก่อนหน้า
        </button>

        <div class="flex items-center gap-2 text-sm text-slate-600">
          <span id="pageInfo">Page 0 / 0</span>
        </div>

        <button
          id="nextBtn"
          class="rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50 disabled:opacity-40 disabled:hover:bg-white transition"
          disabled
        >
          ถัดไป ▶
        </button>
      </div>
    </section>
  </main>
  

  <script src="search.js"></script>
</body>
</html>

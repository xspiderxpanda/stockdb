<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>เพิ่มสินค้า / Import Excel</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<style>
    @font-face {
      font-family: 'LINE Seed Sans TH';
      src: url('/src/fonts/LINESeedSansTH-Regular.woff2') format('woff2');
      font-weight: 300;
      font-style: normal;
    }
    * {
      font-family: 'LINE Seed Sans TH', sans-serif;
    }
    .unit-select {
  padding: 4px 6px;
  font-size: 14px;
}

table tr:hover {
  background-color: #f5f5f5;
}

td {
  vertical-align: middle;
}
</style>
<body class="min-h-screen bg-sky-50">
  <header class="sticky top-0 z-10 border-b bg-white/80 backdrop-blur">
    <div class="mx-auto max-w-5xl px-6 py-4 flex items-center justify-between">
      <div>
        <h1 class="text-lg font-semibold text-slate-900">เพิ่มสินค้า / Import Excel</h1>
        <p class="text-xs text-slate-500">เพิ่มทีละรายการ หรืออัปโหลดไฟล์ .xlsx</p>
      </div>

      <div class="flex gap-2">
        <a href="index.html"
           class="rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50">
          ← กลับหน้าค้นหา
        </a>
        <a href="transaction.html"
           class="rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50">
          🧾 Transaction Logs
        </a>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-6 py-6 space-y-5">
    <!-- Tabs -->
    <div class="rounded-2xl bg-white border border-slate-100 shadow-sm p-4 flex gap-2">
      <button id="tabSingle"
              class="rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white">
        เพิ่มทีละรายการ
      </button>
      <button id="tabImport"
              class="rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50">
        Import Excel (.xlsx)
      </button>
    </div>

    <!-- Single -->
    <section id="panelSingle" class="rounded-2xl bg-white border border-slate-100 shadow-sm p-5">
      <h2 class="text-sm font-semibold text-slate-900">เพิ่มสินค้า (ทีละรายการ)</h2>

      <div class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-medium text-slate-600">SKU</label>
          <input id="add_sku" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm" placeholder="เช่น 8976059661298">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600">ชื่อสินค้า</label>
          <input id="add_product_name" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm" placeholder="เช่น น้ำมันพืช 1L">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-600">Unit</label>
          <input id="add_unit" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm" placeholder="เช่น ขวด">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600">Factor</label>
          <input id="add_factor" type="number" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm" value="1">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-600">Price</label>
          <input id="add_price" type="number" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm" value="0">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600">Stock</label>
          <input id="add_stock" type="number" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm" value="0">
        </div>

        <div class="md:col-span-2">
          <label class="block text-xs font-medium text-slate-600">Warehouse</label>
          <input id="add_warehouse" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm" placeholder="เช่น MAIN">
        </div>
      </div>

      <div class="mt-4 flex items-center gap-3">
        <button id="saveSingle"
                class="rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800">
          บันทึก
        </button>
        <div id="msgSingle" class="text-sm text-slate-600"></div>
      </div>
    </section>

    <!-- Import -->
    <section id="panelImport" class="hidden rounded-2xl bg-white border border-slate-100 shadow-sm p-5">
      <h2 class="text-sm font-semibold text-slate-900">Import Excel (.xlsx)</h2>

      <div class="mt-4">
        <input id="importFileInput" type="file" accept=".xlsx,.csv"
               class="block w-full text-sm text-slate-700 file:mr-4 file:rounded-xl file:border-0 file:bg-slate-900 file:px-4 file:py-2 file:text-sm file:font-semibold file:text-white hover:file:bg-slate-800">
      </div>

      <div class="mt-4 flex items-center gap-3">
        <button id="uploadExcel"
                class="rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800">
          อัปโหลด
        </button>
        <div id="msgImport" class="text-sm text-slate-600"></div>
      </div>

      <div class="mt-4 rounded-xl border border-slate-200 bg-slate-50 p-3 text-sm text-slate-700">
        <div class="font-semibold mb-2">Logs</div>
        <div id="importLogs" class="space-y-1"></div>
      </div>
    </section>
  </main>

  <!-- XLSX: ใช้สำหรับอ่านไฟล์ .xlsx ฝั่งหน้าบ้าน (client_chunk) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="import.js"></script>
</body>
</html>
